backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "portfolio"
    label: "Portfolio"
    files:
      - name: "videos"
        label: "Portfolio Videos"
        file: "data/videos.json"
        fields:
          - label: "Videos"
            name: "videos"
            widget: "list"
            summary: "{{fields.url}}"
            fields:
              - { label: "YouTube video or Shorts link", name: "url", widget: "string", hint: "Paste the full YouTube link" }
